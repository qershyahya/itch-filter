<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>itch.io Content Filter — Settings</title>
<style>
  body { font: 14px system-ui, sans-serif; background: #1b1733; color: #f4f1e8; margin: 0; padding: 20px; min-width: 420px; }
  h1 { color: #ffc247; font-size: 20px; margin: 0 0 4px; }
  .sub { color: #a99fce; margin: 0 0 18px; }
  label { display: block; margin: 14px 0 4px; font-weight: 600; }
  textarea { width: 100%; box-sizing: border-box; background: #241d46; color: #f4f1e8; border: 1px solid #43386f; border-radius: 6px; padding: 8px; font: 12px monospace; }
  input[type=password] { background: #241d46; color: #f4f1e8; border: 1px solid #43386f; border-radius: 6px; padding: 8px; font-size: 14px; }
  button { background: #ffc247; color: #241b3a; border: 0; border-radius: 8px; padding: 10px 18px; font-weight: 700; cursor: pointer; margin-top: 12px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 10px 0; }
  .msg { color: #6fd39a; margin-top: 10px; min-height: 18px; }
  small { color: #a99fce; }
  .hidden { display: none; }
</style>
</head>
<body>
  <h1>itch.io Content Filter</h1>
  <p class="sub">Settings are PIN-protected. Only a parent/teacher should have the PIN.</p>

  <div id="setpin" class="hidden">
    <label>Create a parent PIN</label>
    <input type="password" id="newpin" placeholder="Choose a PIN (4+ chars)" />
    <button id="createpin">Set PIN</button>
  </div>

  <div id="lock" class="hidden">
    <label>Enter parent PIN to edit</label>
    <input type="password" id="pin" placeholder="Parent PIN" />
    <button id="unlock">Unlock</button>
  </div>

  <div id="editor" class="hidden">
    <div class="row"><input type="checkbox" id="enabled" /><label style="margin:0">Filter enabled</label></div>
    <label>Banned tags / genres <small>(one per line)</small></label>
    <textarea id="bannedTags" rows="5"></textarea>
    <label>Banned keywords <small>(one per line)</small></label>
    <textarea id="bannedKeywords" rows="8"></textarea>
    <label>Block-list <small>(URL words: jam slugs, creators, game slugs — one per line)</small></label>
    <textarea id="blockedSlugs" rows="3"></textarea>
    <label>Blocked creators <small>(usernames)</small></label>
    <textarea id="blockedCreators" rows="2"></textarea>
    <label>Allow overrides <small>(game ids to never hide)</small></label>
    <textarea id="allowedIds" rows="2"></textarea>
    <label>Review form — response URL <small>(Google Form .../formResponse)</small></label>
    <input type="text" id="reviewUrl" style="width:100%;box-sizing:border-box;background:#241d46;color:#f4f1e8;border:1px solid #43386f;border-radius:6px;padding:8px;font:12px monospace" />
    <label>Review form — URL field id <small>(e.g. entry.123456789)</small></label>
    <input type="text" id="reviewEntry" style="width:100%;box-sizing:border-box;background:#241d46;color:#f4f1e8;border:1px solid #43386f;border-radius:6px;padding:8px;font:12px monospace" />
    <button id="save">Save changes</button>
  </div>

  <p class="msg" id="msg"></p>
  <script src="options.js"></script>
</body>
</html>
